{% if page.has_other_pages %}
<nav class="pager" aria-label="Pages">
  {% if page.has_previous %}<a class="btn ghost small" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page.previous_page_number }}">← Prev</a>{% endif %}
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn ghost small" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page.next_page_number }}">Next →</a>{% endif %}
</nav>
{% endif %}
